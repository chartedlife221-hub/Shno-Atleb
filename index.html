<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>شنو أطلب؟ · Shno Atleb</title>
  <meta name="description" content="الطلب الصح من أشهر الكافيهات في الكويت: اسم الطلب بالضبط، مكتوب لك على الكوب. Kuwait's exact coffee and dessert order, written on your cup.">
  <meta name="theme-color" content="#f4ecdf" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16110d" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="google" content="notranslate">
  <meta property="og:title" content="شنو أطلب؟ · Shno Atleb">
  <meta property="og:description" content="Kuwait's exact coffee and dessert order, written on your cup.">
  <meta property="og:type" content="website">
  <link rel="icon" href="./public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/styles/main.css">
  <script type="module" src="./src/main.ts"></script>
</head>
<body>
  <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-bean" viewBox="0 0 24 24"><path d="M12 2c5 0 9 4.5 9 10s-4 10-9 10S3 17.5 3 12 7 2 12 2z" fill="currentColor"/><path d="M12 4c-2 3 2 5 0 8s2 5 0 8" fill="none" stroke="var(--paper)" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.8.8-5 4.7 1.4 6.8L12 17l-6.1 3.6 1.4-6.8-5-4.7 6.8-.8z" fill="currentColor"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z" fill="currentColor"/><circle cx="12" cy="10" r="2.5" fill="var(--paper)"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1112 0v6l2 2H4zM10 21h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" fill="currentColor"/></symbol>
  </svg>

  <div class="env" aria-hidden="true"><i class="env__arch"></i><i class="env__arch env__arch--2"></i><i class="env__light"></i><i class="env__grain"></i></div>
  <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false"><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.18  0 0 0 0 0.15  0 0 0 0.55 0"/></filter></svg>

  <a class="skip" href="#main" data-i18n="skip">Skip</a>
  <p class="banner" data-i18n="banner">banner</p>

  <header class="top">
    <a class="brand" href="#top" data-i18n-aria-label="brandAria" aria-label="Shno Atleb">
      <svg class="icon brand__bean" aria-hidden="true" focusable="false"><use href="#i-bean"/></svg>
      <span class="brand__ar">شنو أطلب؟</span>
      <span class="brand__en" lang="en" dir="ltr">Shno Atleb</span>
    </a>
    <nav class="nav" data-i18n-aria-label="navAria" aria-label="Main">
      <a href="#pick" data-i18n="navPick">Pick</a>
      <a href="#browse" data-i18n="navBrowse">Browse</a>
      <a href="#areas" data-i18n="navAreas">Areas</a>
      <a href="#share" data-i18n="navShare">Share</a>
    </nav>
    <div class="top__tools">
      <button type="button" class="chip chip--tool" id="lang-btn" data-i18n="langBtn" data-i18n-aria-label="langAria">EN</button>
      <button type="button" class="chip chip--tool" id="theme-btn" aria-pressed="false" aria-label="Theme">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-moon"/></svg>
      </button>
      <a class="btn btn--small btn--ink" href="#join" data-i18n="navJoin">Join</a>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="hero" id="pick" aria-labelledby="hero-title">
      <div class="hero__copy">
        <p class="hero__greet" id="greeting"></p>
        <h1 class="hero__title" id="hero-title" data-i18n="heroTitle">Title</h1>
        <p class="hero__sub" data-i18n="heroSub">Sub</p>

        <fieldset class="moods">
          <legend data-i18n="moodLegend">Mood</legend>
          <div class="moods__row" id="moods"></div>
        </fieldset>

        <div class="hero__actions">
          <button type="button" class="btn btn--sun" id="shuffle-btn">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-dice"/></svg>
            <span data-i18n="shuffle">Shuffle</span>
          </button>
          <button type="button" class="btn btn--ink" id="show-btn">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-eye"/></svg>
            <span data-i18n="showBarista">Show barista</span>
          </button>
          <button type="button" class="btn btn--ghost" id="copy-btn">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-copy"/></svg>
            <span data-i18n="copyOrder">Copy</span>
          </button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
      <div class="hero__stage" id="stage">
        <div class="portal" id="portal">
          <video id="v-iced" class="portal__video" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
          <img class="portal__backdrop" id="hero-backdrop" alt="" aria-hidden="true">
          <video id="v-frappe" class="portal__video" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
          <video id="v-spanish" class="portal__video" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
          <video id="v-hot" class="portal__video" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
          <img class="portal__video portal__plate" id="hero-plate" alt="" aria-hidden="true">
          <div class="portal__grade" aria-hidden="true"></div>
          <button type="button" class="portal__touch" id="cup-btn" data-i18n-aria-label="cupBtnAria" aria-label="Take"></button>
        </div>
        <p class="stage__hint glass" id="gl-hint" aria-hidden="true"><span data-i18n="cupHint">Touch</span></p>
        <div class="order glass" id="order">
          <p class="order__name" id="o-name"></p>
          <p class="order__cafe" id="o-cafe"></p>
          <p class="order__price" id="o-price" dir="ltr"></p>
        </div>
      </div>
    </section>

    <div class="ticker" data-i18n-aria-label="tickerLabel" aria-label="Ticker" role="group">
      <div class="ticker__track" id="ticker"></div>
    </div>

    <section class="section" id="top" aria-labelledby="top-title">
      <header class="section__head">
        <h2 id="top-title" data-i18n="topTitle">Top 10</h2>
        <p data-i18n="topSub">Sub</p>
      </header>
      <ol class="rail" id="top-list"></ol>
    </section>

    <section class="section" id="browse" aria-labelledby="browse-title">
      <header class="section__head">
        <h2 id="browse-title" data-i18n="browseTitle">Browse</h2>
        <p data-i18n="browseSub">Sub</p>
      </header>
      <form class="filters" id="filters" role="search" novalidate>
        <label class="field field--wide">
          <span class="field__label" data-i18n="searchLabel">Search</span>
          <input class="input" type="search" id="f-query" name="q" maxlength="60" autocomplete="off" data-i18n-placeholder="searchPh" placeholder="Search">
        </label>
        <label class="field"><span class="field__label" data-i18n="fArea">Area</span><select class="input" id="f-area" name="area"></select></label>
        <label class="field"><span class="field__label" data-i18n="fCafe">Cafe</span><select class="input" id="f-cafe" name="cafe"></select></label>
        <label class="field"><span class="field__label" data-i18n="fPrice">Price</span><select class="input" id="f-price" name="price"></select></label>
        <button type="button" class="btn btn--ghost btn--small" id="f-clear" data-i18n="clearFilters">Clear</button>
      </form>
      <div class="cats" id="cats" role="group" data-i18n-aria-label="browseTitle" aria-label="Categories"></div>
      <p class="count" id="count" role="status" aria-live="polite"></p>
      <ul class="grid" id="grid"></ul>
      <p class="empty" id="empty" hidden data-i18n="empty">Empty</p>
    </section>

    <section class="section section--map" id="areas" aria-labelledby="areas-title">
      <header class="section__head">
        <h2 id="areas-title" data-i18n="areasTitle">Areas</h2>
        <p data-i18n="areasSub">Sub</p>
      </header>
      <div class="map" id="map"></div>
      <p class="note" data-i18n="mapNote">Note</p>
    </section>

    <section class="section section--forms" id="share" aria-labelledby="share-title">
      <header class="section__head">
        <h2 id="share-title" data-i18n="submitTitle">Share</h2>
        <p data-i18n="submitSub">Sub</p>
      </header>
      <form class="form card-form" id="suggest-form" novalidate autocomplete="off">
        <p class="form__for" id="correcting" hidden></p>
        <div class="form__errors" id="suggest-errors" role="alert" tabindex="-1" hidden></div>
        <label class="field"><span class="field__label" data-i18n="sCafe">Cafe</span><input class="input" name="cafe" maxlength="60" required aria-describedby="suggest-cafe-err"><span class="field__err" id="suggest-cafe-err"></span></label>
        <label class="field"><span class="field__label" data-i18n="sOrder">Order</span><input class="input" name="order" maxlength="80" required aria-describedby="suggest-order-err"><span class="field__err" id="suggest-order-err"></span></label>
        <label class="field"><span class="field__label" data-i18n="fArea">Area</span><select class="input" name="area" id="s-area" required aria-describedby="suggest-area-err"></select><span class="field__err" id="suggest-area-err"></span></label>
        <label class="field"><span class="field__label" data-i18n="sPrice">Price</span><input class="input" name="price" inputmode="decimal" maxlength="8" dir="ltr" aria-describedby="suggest-price-err"><span class="field__err" id="suggest-price-err"></span></label>
        <label class="field field--wide"><span class="field__label" data-i18n="sWhy">Why</span><input class="input" name="why" maxlength="200"></label>
        <label class="trap" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
        <button class="btn btn--sun" type="submit" data-i18n="sBtn">Send</button>
        <p class="form__result" id="suggest-result" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="section section--join" id="join" aria-labelledby="join-title">
      <div class="join">
        <svg class="icon join__icon" aria-hidden="true" focusable="false"><use href="#i-bell"/></svg>
        <div>
          <h2 id="join-title" data-i18n="waitTitle">Join</h2>
          <p data-i18n="waitSub">Sub</p>
        </div>
        <form class="form join__form" id="wait-form" novalidate autocomplete="off">
          <label class="field field--wide"><span class="field__label" data-i18n="waitLabel">Contact</span><input class="input" name="contact" dir="ltr" maxlength="120" inputmode="email" data-i18n-placeholder="waitPh" placeholder="" aria-describedby="wait-contact-err"><span class="field__err" id="wait-contact-err"></span></label>
          <label class="trap" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
          <button class="btn btn--ink" type="submit" data-i18n="waitBtn">Join</button>
          <p class="form__result" id="wait-result" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p data-i18n="footDisclaimer">Disclaimer</p>
    <p><a href="#share" id="foot-correct" data-i18n="footCorrect">Correct</a></p>
  </footer>

  <dialog class="barista" id="barista" aria-labelledby="dlg-name">
    <button type="button" class="barista__close" id="dlg-close" data-i18n-aria-label="dlgClose" aria-label="Close"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"/></svg></button>
    <div class="barista__card">
      <div class="barista__scene" aria-hidden="true">
        <canvas class="barista__bg" id="ho-bg"></canvas>
        <img class="barista__still" id="ho-bg-img" alt="" hidden>
        <div class="barista__scrim"></div>
      </div>
      <div class="barista__text">
        <p class="barista__say" data-i18n="sayIt">Say</p>
        <p class="barista__name" id="dlg-name" lang="en" dir="ltr"></p>
        <p class="barista__name barista__name--ar" id="dlg-name-ar" lang="ar" dir="rtl"></p>
        <p class="barista__cafe" id="dlg-cafe"></p>
        <p class="barista__price" id="dlg-price"></p>
        <p class="barista__note" id="dlg-note" hidden></p>
      </div>
    </div>
    <canvas class="handoff" id="ho-fg" aria-hidden="true"></canvas>
    <img class="handoff handoff--still" id="ho-fg-img" alt="" hidden>
    <video class="handoff__src" id="ho-video" muted playsinline preload="auto" disablepictureinpicture tabindex="-1" aria-hidden="true"></video>
    <div class="barista__actions">
      <button type="button" class="btn btn--sun" id="dlg-copy" data-i18n="dlgCopy">Copy</button>
      <button type="button" class="btn btn--ink" id="dlg-share" data-i18n="dlgShare" hidden>Share</button>
      <a class="btn btn--ghost" id="dlg-map" target="_blank" rel="noopener noreferrer" data-i18n="dlgMap">Map</a>
    </div>
  </dialog>

  <noscript><p class="banner">يتطلب الموقع تفعيل JavaScript. This site needs JavaScript.</p></noscript>
</body>
</html>
