<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#A5A25B">
<title>شنو أطلب؟ — Shno Atleb</title>
<meta name="description" content="Kuwait's best-selling coffee orders, in one place. The exact order to get in Kuwait.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lalezar&family=Noto+Kufi+Arabic:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="banner" data-i18n="banner"></div>

<main id="top">
  <!-- 1. HERO -->
  <section class="hero" aria-label="Shno Atleb">
    <div class="hero-frame" id="heroFrame">
      <svg class="mound" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="moundg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C8F48"/><stop offset=".45" stop-color="#4C5E2C"/><stop offset="1" stop-color="#222E19"/></linearGradient>
          <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="4"/><feDisplacementMap in="SourceGraphic" scale="16"/></filter>
          <clipPath id="moundclip"><path id="moundpath" d="M-20 300 L-20 175 C70 150 130 118 210 135 C300 152 340 96 430 82 C490 72 520 62 560 74 C640 96 690 142 770 126 C860 108 930 150 1020 162 L1020 300 Z"/></clipPath>
        </defs>
        <g filter="url(#rough)"><path d="M-20 300 L-20 175 C70 150 130 118 210 135 C300 152 340 96 430 82 C490 72 520 62 560 74 C640 96 690 142 770 126 C860 108 930 150 1020 162 L1020 300 Z" fill="url(#moundg)"/></g>
        <g id="speckles" clip-path="url(#moundclip)"></g>
      </svg>

      <div class="hero-top">
        <a class="logo" href="#top">Shno Atleb</a>
        <nav class="pillnav" id="heroNav" data-i18n-aria="navAria"></nav>
        <button class="lang js-lang" type="button"></button>
      </div>

      <div class="caption" id="caption"></div>

      <div class="stage" id="stage" tabindex="0" role="group" aria-roledescription="carousel" data-i18n-aria="heroAria">
        <div class="tiles" id="tiles"></div>
        <div class="cupwrap">
          <div class="cup-art" id="cupArt" data-kind="cup">
            <svg class="cup" viewBox="0 0 200 300" aria-hidden="true">
              <defs>
                <clipPath id="cupclip"><path d="M26 34 L174 34 L156 280 Q155 290 145 290 L55 290 Q45 290 44 280 Z"/></clipPath>
                <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".18" stop-color="#fff" stop-opacity=".38"/><stop offset=".32" stop-color="#fff" stop-opacity="0"/><stop offset=".84" stop-color="#fff" stop-opacity="0"/><stop offset=".92" stop-color="#fff" stop-opacity=".24"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
                <linearGradient id="depth" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
              </defs>
              <ellipse cx="100" cy="292" rx="62" ry="8" fill="#000" opacity=".3"/>
              <g clip-path="url(#cupclip)">
                <rect x="0" y="34" width="200" height="270" fill="rgba(255,255,255,.12)"/>
                <path class="L1" d="M0 78 Q50 66 100 78 T200 78 V300 H0Z"/>
                <path class="L2" d="M0 120 Q50 132 100 120 T200 120 V300 H0Z"/>
                <path class="L3" d="M0 170 Q50 158 100 170 T200 170 V300 H0Z"/>
                <path class="L4" d="M0 222 Q50 234 100 222 T200 222 V300 H0Z"/>
                <g fill="rgba(255,255,255,.26)" stroke="rgba(255,255,255,.6)" stroke-width="1.5">
                  <rect x="44" y="46" width="44" height="40" rx="9" transform="rotate(-12 66 66)"/>
                  <rect x="106" y="42" width="46" height="42" rx="10" transform="rotate(10 129 63)"/>
                  <rect x="76" y="82" width="40" height="36" rx="9" transform="rotate(4 96 100)"/>
                </g>
                <rect x="0" y="34" width="200" height="260" fill="url(#depth)"/>
                <rect x="0" y="34" width="200" height="260" fill="url(#shine)"/>
              </g>
              <path d="M26 34 L174 34 L156 280 Q155 290 145 290 L55 290 Q45 290 44 280 Z" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5"/>
              <ellipse cx="100" cy="34" rx="74" ry="7" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.7)" stroke-width="2.5"/>
            </svg>
            <svg class="cake" viewBox="0 0 200 300" aria-hidden="true">
              <defs>
                <clipPath id="cakefront"><rect x="34" y="190" width="116" height="88" rx="8"/></clipPath>
                <clipPath id="cakeside"><path d="M150 190 L176 168 L176 256 L150 278 Z"/></clipPath>
              </defs>
              <ellipse cx="100" cy="284" rx="94" ry="14" fill="#000" opacity=".28"/>
              <ellipse cx="100" cy="278" rx="92" ry="13" fill="#F3F0E2"/>
              <ellipse cx="100" cy="276" rx="70" ry="9" fill="#E3DFC9"/>
              <g clip-path="url(#cakeside)"><rect x="150" y="160" width="30" height="24" class="L1"/><rect x="150" y="184" width="30" height="24" class="L2"/><rect x="150" y="208" width="30" height="24" class="L3"/><rect x="150" y="232" width="30" height="50" class="L4"/><rect x="150" y="160" width="30" height="130" fill="#000" opacity=".28"/></g>
              <g clip-path="url(#cakefront)"><rect x="34" y="190" width="116" height="22" class="L1"/><rect x="34" y="212" width="116" height="22" class="L2"/><rect x="34" y="234" width="116" height="22" class="L3"/><rect x="34" y="256" width="116" height="24" class="L4"/><rect x="34" y="190" width="116" height="90" fill="url(#shine)"/></g>
              <path d="M34 190 L150 190 L176 168 L60 168 Z" class="L1"/>
              <path d="M34 190 L150 190 L176 168 L60 168 Z" fill="#fff" opacity=".22"/>
              <ellipse cx="108" cy="178" rx="16" ry="5.5" fill="#B96F3A"/>
              <ellipse cx="108" cy="176.5" rx="12" ry="3.5" fill="#D79255"/>
            </svg>
            <div class="cup-label" id="cupLabel"></div>
          </div>
        </div>
        <button class="pricetile" id="priceTile" type="button"><b id="ptPrice"></b><small id="ptKd"></small><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
      </div>

      <h1 class="hero-h1" data-i18n="heroH1"></h1>
    </div>

    <div class="hero-under">
      <form class="search" id="searchForm" role="search">
        <label class="sr" for="q" data-i18n="searchLabel"></label>
        <input id="q" type="search" autocomplete="off" data-i18n-ph="searchPh">
        <button type="submit" data-i18n="searchBtn"></button>
      </form>
      <p class="sub" data-i18n="heroSub"></p>
      <p class="tag" data-i18n="tagline"></p>
    </div>
  </section>

  <!-- 2. Top 10 -->
  <section class="wrap" id="top10">
    <div class="sec-head"><h2 data-i18n="topTitle"></h2><p data-i18n="topSub"></p></div>
    <div class="scroller" id="topScroller" tabindex="0"></div>
  </section>

  <!-- 3-5. Chips, filters, grid -->
  <section class="wrap" id="menu">
    <div class="sec-head"><h2 data-i18n="allTitle"></h2><p data-i18n="allSub"></p></div>
    <div class="chips" id="chips" role="group"></div>
    <div class="filters" id="filters">
      <div><label for="fArea" data-i18n="fArea"></label><select id="fArea"></select></div>
      <div><label for="fCafe" data-i18n="fCafe"></label><select id="fCafe"></select></div>
      <div><label for="fPrice" data-i18n="fPrice"></label><select id="fPrice"></select></div>
      <div><label for="fType" data-i18n="fType"></label><select id="fType"></select></div>
    </div>
    <div class="resultbar"><span id="count" aria-live="polite"></span><button class="linkbtn" id="resetBtn" type="button" data-i18n="reset"></button></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 6. Areas -->
  <section class="wrap" id="areas">
    <div class="sec-head"><h2 data-i18n="areaTitle"></h2></div>
    <div class="areas" id="areaTiles"></div>
  </section>

  <!-- 7. Submit -->
  <section class="wrap" id="submit">
    <div class="panel">
      <h2 data-i18n="submitTitle"></h2>
      <p class="lead" data-i18n="submitSub"></p>
      <div class="note" id="corrNote" hidden></div>
      <form class="form" id="submitForm" style="margin-top:12px">
        <div class="two">
          <div><label for="sCafe" data-i18n="sCafe"></label><input id="sCafe" required></div>
          <div><label for="sOrder" data-i18n="sOrder"></label><input id="sOrder" required></div>
        </div>
        <div class="two">
          <div><label for="sArea" data-i18n="fArea"></label><select id="sArea"></select></div>
          <div><label for="sPrice" data-i18n="sPrice"></label><input id="sPrice" inputmode="decimal" placeholder="1.750"></div>
        </div>
        <div><label for="sWhy" data-i18n="sWhy"></label><textarea id="sWhy"></textarea></div>
        <button class="btn" type="submit" data-i18n="sBtn"></button>
      </form>
      <div class="success" id="submitOk" hidden>
        <strong data-i18n="sOk"></strong>
        <p style="margin-top:6px"><button class="linkbtn" id="submitAgain" type="button" style="color:#F2C14E" data-i18n="sAgain"></button></p>
      </div>
    </div>
  </section>

  <!-- 8. Waitlist -->
  <section class="wrap" id="waitlist">
    <div class="panel light">
      <h2 data-i18n="waitTitle"></h2>
      <p class="lead" data-i18n="waitSub"></p>
      <form class="form" id="waitForm">
        <div><label for="wContact" data-i18n="wLabel"></label><input id="wContact" required data-i18n-ph="wPh"></div>
        <button class="btn" type="submit" data-i18n="wBtn"></button>
      </form>
      <div class="success" id="waitOk" hidden><strong data-i18n="wOk"></strong></div>
    </div>
  </section>
</main>

<!-- 9. Footer -->
<footer>
  <div class="wrap cols">
    <p data-i18n="disclaimer"></p>
    <p><a href="#submit" id="footCorr" data-i18n="footCorr"></a></p>
    <p>Instagram <a href="#">@shnoatleb</a> · TikTok <a href="#">@shnoatleb.kw</a></p>
    <p class="small">© <span id="yr"></span> شنو أطلب؟ / Shno Atleb</p>
  </div>
</footer>

<!-- Floating nav, shown after the hero scrolls away -->
<div class="dock" id="dock"><nav class="pillnav" id="dockNav" data-i18n-aria="navAria"></nav><button class="lang js-lang" type="button" style="background:rgba(250,248,236,.16)"></button></div>

<script src="data/items.js"></script>
<script src="js/i18n.js"></script>
<script src="js/hero-art.js"></script>
<script src="js/app.js"></script>
</body>
</html>
